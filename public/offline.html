<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — AdaptaJIREH</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .tarjeta {
      text-align: center;
      padding: 2.5rem 1.75rem;
      max-width: 380px;
    }
    .tarjeta img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
    p  { font-size: 0.9375rem; line-height: 1.6; color: #475569; margin: 0 0 1.5rem; }
    button {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <img src="/icon-192.png" alt="AdaptaJIREH" />
    <h1>Sin conexión a internet</h1>
    <p>
      No se pudo cargar esta página. Si ya habías abierto la app con internet,
      puedes volver atrás y seguir <strong>leyendo tus apuntes</strong>;
      para responder repasos necesitas conexión.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
